apiVersion: apps/v1
kind: Deployment
metadata:
  name: htpasswd
  labels:
    app.kubernetes.io/name: htpasswd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: htpasswd
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: htpasswd
    spec:
      serviceAccountName: htpasswd
      containers:
      - name: htpasswd
        image: htpasswd
        imagePullPolicy: IfNotPresent
        command:
        - /contour-auth-multi-tenant
        args:
        - htpasswd
        - --address=:9443
        - --health-address=:8081
        - --tls-ca-path=/tls/ca.crt
        - --tls-cert-path=/tls/tls.crt
        - --tls-key-path=/tls/tls.key
        ports:
        - name: auth
          containerPort: 9443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        resources:
          limits:
            cpu: 100m
            memory: 90Mi
      volumes:
      - name: tls
        secret:
          secretName: htpasswd

---

apiVersion: v1
kind: Service
metadata:
  name: htpasswd
  labels:
    app.kubernetes.io/name: htpasswd
spec:
  ports:
  - name: auth
    protocol: TCP
    port: 9443
    targetPort: 9443
  selector:
    app.kubernetes.io/name: htpasswd
  type: ClusterIP
