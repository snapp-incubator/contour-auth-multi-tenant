apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc
  labels:
    app.kubernetes.io/name: oidc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oidc
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oidc
    spec:
      serviceAccountName: oidc
      containers:
      - name: oidc
        image: oidc
        imagePullPolicy: IfNotPresent
        command:
        - /contour-auth-multi-tenant
        args:
        - oidc
        - --config=/config/auth-svr-config.yaml
        - --health-address=:8081
        - --tls-ca-path=/tls/ca.crt
        - --tls-cert-path=/tls/tls.crt
        - --tls-key-path=/tls/tls.key
        ports:
        - name: auth
          containerPort: 9443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: oidc-config
          mountPath: /config
        resources:
          limits:
            cpu: 100m
            memory: 30Mi
      volumes:
      - name: tls
        secret:
          secretName: oidc
      - name: oidc-config
        configMap:
          name: oidc-config
      

---
apiVersion: v1
kind: Service
metadata:
  name: oidc
  labels:
    app.kubernetes.io/name: oidc
spec:
  ports:
  - name: auth
    protocol: TCP
    port: 9443
    targetPort: 9443
  selector:
    app.kubernetes.io/name: oidc
  type: ClusterIP
